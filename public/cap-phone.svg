<title>지주캡에 폰 대는 법 (입체)</title>
<desc>위 왼쪽 A : 폰을 긴 옆면이 주판에 닿게 세워 뒷면을 WEB 에 기대고, 긴 축이 WEB 과 평행. FRAME 선을 따라 대면 틀림. 위 오른쪽 B : 폰을 긴 옆면이 주판에 닿게 세워 뒷면을 가운데 브라켓에 기대고, 긴 축이 WEB 과 직각, 카메라 쪽 머리를 선수로. 아래 왼쪽 : 폰 긴 축을 위아래로 세워 WEB 면에 대면 틀림. 아래 오른쪽 : 세운 폰을 권장, 눕힌 폰은 뒷면이 평평할 때만.</desc>
